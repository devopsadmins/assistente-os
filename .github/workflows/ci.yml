name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistente_os
          POSTGRES_PASSWORD: assistente_os
          POSTGRES_DB: assistente_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistente_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://assistente_os:assistente_os@localhost:5432/assistente_os

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordem documentada em AGENTS.md: build (tsc -b resolve as referências
      # entre pacotes do monorepo) antes de typecheck/test.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Gate AI-3 (ADR-AI-003 §6 / roadmap E8.2): a cada build gera o manifesto de execução
      # determinístico (tiers do router, catálogo de capacidades L1/L2/L3,
      # souls, migrações aplicadas + hash) e anexa ao build.
      #
      # `os <cmd>` roda runMigrations() antes de qualquer comando que toca o
      # banco e imprime "migrações aplicadas: ..." em stdout na primeira vez.
      # Rodamos `os status` primeiro para drenar essa saída contra o Postgres
      # limpo do serviço; assim `os manifest` emite só o JSON (redirect limpo)
      # e o array `migrations` já vem populado.
      - name: Prime database (migrations)
        run: node packages/cli/dist/index.js status

      - name: Execution manifest
        run: |
          node packages/cli/dist/index.js manifest > "manifest-${GITHUB_SHA}.json"
          cat "manifest-${GITHUB_SHA}.json"

      - name: Upload execution manifest
        uses: actions/upload-artifact@v4
        with:
          name: execution-manifest-${{ github.sha }}
          path: manifest-*.json
          if-no-files-found: error
          retention-days: 90
