name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Governança como Código: valida no PR o plano de rollback, a referência de
  # rastreabilidade, a descrição mínima e — para caminhos sensíveis — a presença
  # do label de revisão. Ref: T1.1 de docs/ARCHITECTURE-REVIEW.md.
  compliance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test compliance rules
        run: node --test .github/scripts/*.test.mjs

      - name: Compliance gate
        run: node .github/scripts/compliance-gate.mjs

      # SPEC-HR5: o guard existia desde o ADR-UI-001 (2026-09-01) com testes
      # unitários cobrindo checkPackage/findUnassignedPackages, mas o main()
      # — que varre os package.json reais do monorepo — nunca tinha rodado em
      # CI (achado 2026-09-05). Sem isto, uma dependência nova fora da
      # allowlist não era barrada por nada no pipeline.
      - name: Dependency zones gate
        run: node .github/scripts/deps-zones.mjs

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistente_os
          POSTGRES_PASSWORD: assistente_os
          POSTGRES_DB: assistente_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistente_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://assistente_os:assistente_os@localhost:5432/assistente_os

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordem documentada em AGENTS.md: build (tsc -b resolve as referências
      # entre pacotes do monorepo) antes de typecheck/test.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # SPEC-EP2 Frente 1 (2026-09-05): política contra `any` explícito
      # (no-explicit-any como erro). Testes ficam fora da regra (ver
      # eslint.config.js) — `any` em mock/fixture é uso legítimo lá.
      - name: Lint
        run: npm run lint

      # Prime o Postgres do serviço ANTES dos testes: `os status` roda
      # runMigrations() no schema `public`, o que inclui `0001_extensions`
      # (CREATE EXTENSION vector). Sem isto, o `public` fica vazio e os testes
      # que não criam schema isolado próprio (langgraph-tools.test.ts com pool
      # cru) ou cujo `CREATE EXTENSION IF NOT EXISTS vector` num schema de teste
      # não resolve o tipo `vector` falhavam ("type vector does not exist" /
      # "relation chunks does not exist"). Com o `public` já migrado, o
      # search_path `<schema>,public` dos helpers de teste enxerga o tipo e as
      # tabelas base — mesmo estado do dev local.
      - name: Prime database (migrations + pgvector)
        run: node packages/cli/dist/index.js status

      - name: Test
        run: npm test

      # Gate AI-3 (ADR-AI-003 §6 / roadmap E8.2): a cada build gera o manifesto de
      # execução determinístico (tiers do router, catálogo L1/L2/L3, souls,
      # migrações aplicadas + hash) e anexa ao build.

      - name: Execution manifest
        run: |
          node packages/cli/dist/index.js manifest > "manifest-${GITHUB_SHA}.json"
          cat "manifest-${GITHUB_SHA}.json"

      - name: Upload execution manifest
        uses: actions/upload-artifact@v4
        with:
          name: execution-manifest-${{ github.sha }}
          path: manifest-*.json
          if-no-files-found: error
          retention-days: 90

  # SPEC-GR4 — gate Discriminator: julga o diff do PR via Guardian
  # (packages/core/src/governance/golden-rules.ts::auditExecution, score
  # 0-100 ISO/IEC 42001) e falha o job (exit != 0) se vier abaixo de 95/100.
  # Roda depois de build-and-test (não gasta chamada de LLM num build quebrado).
  # Usa o Zen (cloud) — o runner não tem Ollama local; requer o secret
  # ZEN_API_KEYS (lista separada por vírgula, rodízio round-robin — ver
  # packages/core/src/zen-keys.ts) ou ZEN_API_KEY (chave única, compat) no
  # repositório (Settings → Secrets and variables → Actions). ZEN_API_KEYS
  # tem precedência: com várias chaves cadastradas, espalha o consumo entre
  # PRs em vez de bater rate-limit numa única chave.
  # Rodar localmente: `node packages/cli/dist/index.js discriminator --base origin/main`
  # (sem nenhuma configurada na máquina, cai pro Ollama local automaticamente).
  discriminator:
    name: Discriminator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      ZEN_API_KEYS: ${{ secrets.ZEN_API_KEYS }}
      ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git diff origin/<base>...HEAD precisa do histórico completo dos
          # dois lados — checkout raso (default) não tem o ref da base.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Discriminator
        run: node packages/cli/dist/index.js discriminator --out "discriminator-${GITHUB_SHA}.json"

      # if: always() — o parecer (mesmo reprovado) precisa ficar disponível
      # pra revisão manual; sem isto, um exit!=0 no passo acima pularia o upload.
      - name: Upload discriminator verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discriminator-${{ github.sha }}
          path: discriminator-*.json
          if-no-files-found: warn
          retention-days: 90
