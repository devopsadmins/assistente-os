name: RAG eval (corpus real)

# Roda o golden set real (~/.assistant-os/rag-golden.jsonl) contra a soul
# consultoria_ia. O soul e o índice são dados de cliente — NÃO existem nos
# runners hospedados do GitHub —, então este workflow só faz sentido num
# runner self-hosted com ~/.assistant-os presente e Postgres acessível.
# Evidência de auditoria para ADR-RAG-001 §6. Ref: T1.3 de docs/ARCHITECTURE-REVIEW.md.

on:
  workflow_dispatch:
    inputs:
      soul:
        description: "soul a avaliar"
        default: "consultoria_ia"
      min_hit1:
        description: "piso de hit@1 (falha abaixo disso)"
        default: "0.70"
      rerank:
        description: "off | cross-encoder | llm"
        default: "off"

jobs:
  rag-eval:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: os rag eval
        run: |
          set -a; . ~/.assistant-os/.env; set +a
          node packages/cli/dist/index.js rag eval "${{ inputs.soul }}" \
            --rerank "${{ inputs.rerank }}" --min-hit1 "${{ inputs.min_hit1 }}" \
            | tee "rag-eval-${{ inputs.soul }}-${{ inputs.rerank }}.txt"

      - name: Upload resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-${{ inputs.soul }}-${{ inputs.rerank }}
          path: rag-eval-*.txt
          if-no-files-found: error
          retention-days: 90
